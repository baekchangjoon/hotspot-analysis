# Hotspot Analysis Configuration (Phase 1)
# Usage: hotspot analyze --config ./hotspot.yml

analysis:
  target:
    # local-git | github
    type: local-git
    # Required when type=local-git -- a directory that contains a .git/ folder.
    path: ./my-spring-project
    # Required when type=github. Uncomment and switch type accordingly.
    # github:
    #   owner: myorg
    #   repo: myrepo
    #   branch: main
    #   token: ${GITHUB_TOKEN}

  window:
    # Mode A: relative window (last N days from "now") -- safe default for
    # actively maintained repositories.
    days: 365
    # Mode B: absolute ISO-8601 date range (use INSTEAD of `days`).
    # Switch to this when the repo has been inactive for longer than `days`,
    # otherwise the analysis will report "Commits: 0".
    # since: "2024-01-01"
    # until: "2026-01-01"

  scope:
    # file | method  (both can be combined)
    granularity: [file, method]
    include:
      # Single-module Spring Boot project.
      - "src/main/java/**/*.java"
      # Multi-module Gradle/Maven project -- uncomment if your repository
      # contains sub-modules such as `service-a/`, `service-b/` ...
      # - "**/src/main/java/**/*.java"
    exclude:
      - "**/generated/**"
      - "**/test/**"
      - "**/build/**"
      - "**/target/**"

  scoring:
    # Phase 1: simple = revisions * loc
    formula: simple

output:
  # csv | yaml | md (multiple allowed, case-insensitive)
  formats: [csv, yaml, md]
  path: ./hotspot-report
  # 0 = all rows
  topN: 50
