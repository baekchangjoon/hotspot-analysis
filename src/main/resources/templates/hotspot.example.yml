# Hotspot Analysis Configuration (Phase 1)
# Usage: hotspot analyze --config ./hotspot.yml

analysis:
  target:
    # local-git | github
    type: local-git
    # Required when type=local-git -- a directory that contains a .git/ folder.
    path: ./my-spring-project
    # Required when type=github. Uncomment and switch type accordingly.
    # github:
    #   owner: myorg
    #   repo: myrepo
    #   branch: main
    #   token: ${GITHUB_TOKEN}

  window:
    # Mode A: relative window (last N days from "now") -- safe default for
    # actively maintained repositories.
    days: 365
    # Mode B: absolute ISO-8601 date range (use INSTEAD of `days` — comment
    # the `days:` line out first; specifying both is a validation error).
    # Switch to this when the repo has been inactive for longer than `days`,
    # otherwise the analysis will report "Commits: 0".
    # since: "2024-01-01"
    # until: "2026-01-01"

  scope:
    # file | method  (both can be combined)
    granularity: [file, method]
    include:
      # Both patterns are listed because Java NIO's "**" does not match
      # zero path segments. The first catches single-module repos, the
      # second catches multi-module Gradle/Maven repos (service-a/, ...).
      # The collector deduplicates overlapping matches.
      - "src/main/java/**/*.java"
      - "**/src/main/java/**/*.java"
    exclude:
      - "**/generated/**"
      - "**/test/**"
      - "**/build/**"
      - "**/target/**"

  scoring:
    # Optional. Half-life (days) for the exponential recency decay weight
    # applied to each commit. 90 days is the default; raise for slow-moving
    # legacy code, lower for fast-moving features.
    decayHalfLifeDays: 90
    # Optional. When true, coverage is removed from the Composite Score
    # (Composite = Cognitive Complexity x Recency Decay) and every report
    # surfaces the raw line-coverage % in a rightmost column instead of
    # the coverage-multiplier column. Use this when you want coverage as
    # an observational metric rather than a scoring input. Default: false.
    # excludeCoverage: false

  # Optional. REST API endpoint + shared-component granularities (Phase 2).
  # When enabled, the analyzer walks the call graph from each Spring controller
  # endpoint and ranks endpoints by aggregated Composite Score -- the priority
  # input for RestAssured test generation. Off by default.
  # apiAnalysis:
  #   enabled: true
  #   # CUMULATIVE | SEPARATE | BOTH -- how methods called by >=2 endpoints
  #   # are aggregated/reported. Default: BOTH.
  #   sharedComponentMode: BOTH
  #   # Dirs with dependency jars/classes so cross-type calls resolve in the
  #   # call graph. Improves accuracy; optional.
  #   classpathDirectories:
  #     - build/libs

  # Optional. Uncomment ONLY when you actually have a JaCoCo XML report.
  # When supplied, every file/method's Coverage Multiplier is computed as
  # 1 / (line_coverage + 0.1). Absent → multiplier 1.0 (no coverage penalty).
  # A path that does not exist prints a warning and proceeds without coverage.
  # jacocoReportPath: build/reports/jacoco/test/jacocoTestReport.xml

output:
  # csv | yaml | md | html (multiple allowed, case-insensitive)
  # 'html' emits a self-contained hotspots.html that you can open in any
  # browser -- columns are sortable and rows are filterable.
  formats: [csv, yaml, md, html]
  # COMBINED (api/shared tables go into hotspots.*) | STANDALONE (separate
  # api_report.*) | BOTH. Only relevant when apiAnalysis.enabled=true.
  # Default: BOTH.
  # apiLayout: BOTH
  # Optional. When true (and a JaCoCo report is supplied), also writes
  # coverage_breakdown.yml -- the calculation trace behind every coverage
  # number: per-file covered/executable line counts, and per-endpoint
  # per-method contributions. Default: false.
  # coverageBreakdown: true
  path: ./hotspot-report
  # 0 = all rows
  topN: 50
