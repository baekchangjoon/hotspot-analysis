name: release

# One-click release. Run from the Actions tab (Run workflow) with a semver tag.
# Validates the Agent Skills spec, checks the code version matches the tag, then
# `gh skill publish` creates the tag + a GitHub release with auto notes.
#
# A release CREATED by GITHUB_TOKEN does NOT emit an event that triggers other
# workflows (GitHub recursion guard), so this workflow CALLS release-assets and
# docker explicitly (workflow_call) — the button always ships jar + image.
# The release.published auto-fan-out still covers releases made by a real user
# (CLI `gh skill publish` / the UI).
#
# Notes:
# - publish CREATES the tag, so always use a NEW version. The protect-release-tags
#   ruleset blocks deleting/rewriting an existing tag (immutable releases).
# - Bump the code version (build.gradle.kts + manifests) to match the tag first;
#   the version-match step fails fast otherwise.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (semver, e.g. v0.1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gh version
        run: gh --version

      # The Claude plugin marketplace resolves the installed version from
      # plugin.json (NOT marketplace.json), so a release whose tag doesn't match
      # the manifests strands marketplace users on the old version. hotspot also
      # carries the version in build.gradle.kts (jar name) and the CLI
      # @Command(version) — enforce all four before publishing.
      - name: Validate version and match it to the code + manifests
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like vX.Y.Z (got: '$VERSION')"
            exit 1
          fi
          code_ver="$(grep -E '^version = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "v$code_ver" != "$VERSION" ]; then
            echo "::error::build.gradle.kts version ($code_ver) != tag ($VERSION). Bump the code version first."
            exit 1
          fi
          cli_ver="$(grep -oE 'version = "hotspot [0-9][^"]*"' \
              src/main/java/io/github/baekchangjoon/hotspotanalysis/cli/HotspotCommand.java \
              | grep -oE '[0-9][^"]*')"
          if [ "v$cli_ver" != "$VERSION" ]; then
            echo "::error::CLI @Command version ($cli_ver) != tag ($VERSION). Bump HotspotCommand.java."
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import json, sys
          tag = sys.argv[1].lstrip("v")
          plugin = json.load(open(".claude-plugin/plugin.json"))["version"]
          market = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          if not (tag == plugin == market):
              print(f"::error::version mismatch: tag={tag}, plugin.json={plugin}, marketplace.json={market}")
              sys.exit(1)
          print(f"version OK: {tag}")
          PY
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Validate skills against the Agent Skills spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh skill publish --tag "$VERSION"

  # A GITHUB_TOKEN-created release doesn't fan out via the release event, so call
  # the asset/image workflows directly. (The release.published triggers on those
  # workflows still cover real-user-created releases.)
  assets:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}

  image:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.publish.outputs.version }}
