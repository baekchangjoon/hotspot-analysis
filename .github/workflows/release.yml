name: release

# One-click release. Run from the Actions tab (Run workflow) with a semver tag.
# It validates the Agent Skills spec, checks the code version matches the tag,
# then `gh skill publish` creates the tag + a GitHub release with auto notes.
# Publishing that release fires release-assets.yml (attaches hotspot.jar) and
# docker.yml (builds the multi-arch ghcr image) — so one click ships the jar,
# the image, and the listing.
#
# Notes:
# - publish CREATES the tag, so always use a NEW version. The protect-release-tags
#   ruleset blocks deleting/rewriting an existing tag (immutable releases).
# - Bump the code version (build.gradle.kts + manifests) to match the tag first;
#   the version-match step below fails fast otherwise.
# - publish also tries to add the `agent-skills` topic; it already exists, so that
#   step is a no-op. (Editing topics needs more than contents:write; if a future
#   run errors there, supply a PAT secret instead of github.token.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (semver, e.g. v0.1.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gh version
        run: gh --version

      - name: Validate version and match it to the code
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like vX.Y.Z (got: '$VERSION')"
            exit 1
          fi
          code_ver="$(grep -E '^version = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "v$code_ver" != "$VERSION" ]; then
            echo "::error::build.gradle.kts version ($code_ver) != tag ($VERSION). Bump the code version first."
            exit 1
          fi

      - name: Validate skills against the Agent Skills spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh skill publish --tag "$VERSION"
