name: Release

# Cut a release by pushing a tag like `v0.1.0`. This builds the self-contained
# fat jar and attaches it to a GitHub Release, so users can download and run it
# without building from source.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build fat jar
        run: ./gradlew bootJar -q

      - name: Verify the jar runs
        run: java -jar build/libs/hotspot-*.jar --version

      - name: Create GitHub Release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/hotspot-*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
