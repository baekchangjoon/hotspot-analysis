name: Release assets

# Attach the runnable fat jar to a release. Two entry points:
#   - on: release.published   → a release created by a real user (CLI
#     `gh skill publish` / `gh release create` / the UI) auto-fans-out here.
#   - on: workflow_call       → the one-click release.yml button calls this
#     explicitly, because a release CREATED by GITHUB_TOKEN does NOT emit a
#     release event that triggers other workflows (GitHub recursion guard).
# Either way EVERY release ends up with a version-stable hotspot.jar, so the
# releases/latest/download/hotspot.jar URL never breaks.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${INPUT_TAG:-$EVENT_TAG}"
          [ -n "$tag" ] || { echo "::error::no release tag resolved"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build fat jar
        run: ./gradlew bootJar -q

      - name: Verify the jar runs
        run: java -jar build/libs/hotspot-*.jar --version

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          # Stable name (permanent download URL) + the versioned artifact.
          cp build/libs/hotspot-*.jar hotspot.jar
          gh release upload "$TAG" hotspot.jar build/libs/hotspot-*.jar \
            --repo "${GITHUB_REPOSITORY}" --clobber
